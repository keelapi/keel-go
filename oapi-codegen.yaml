package: keelclient
generate:
  client: true
  models: true
output-options:
  client-type-name: KeelHTTPClient
  # Keep every component schema the spec publishes, including the evidence
  # schemas that no operation references directly.
  skip-prune: true
compatibility:
  # Name every enum constant <TypeName><Value>, so that adding an enum
  # elsewhere in the spec cannot rename existing constants.
  always-prefix-enum-values: true
